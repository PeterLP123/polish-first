name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate content review claims
        run: npm run audit:content
      - name: Run unit tests
        run: npm test
      - name: Build and enforce bundle budget
        run: npm run build && npm run check:bundle
        env:
          VITE_BASE_PATH: /polish-first/
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Smoke-test production bundle
        run: npm run smoke:production
      - name: Run functional and accessibility browser tests
        run: npx playwright test e2e/app.spec.js

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
        env:
          VITE_BASE_PATH: /polish-first/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
